// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.2'
        // Needed to compile the app module's own hand-written native plugins
        // (see android/app/src/main/java/app/zyron/fitness/). Pinned to match
        // the Kotlin metadata version androidx.media3 1.11.0 was built with —
        // an older compiler can't read newer stdlib metadata and fails with
        // "Class 'kotlin.Unit' was compiled with an incompatible version".
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
